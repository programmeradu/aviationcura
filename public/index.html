<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviation Curator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="background-elements">
        <div class="glow-orb top-left"></div>
        <div class="glow-orb bottom-right"></div>
    </div>

    <div class="app-container" id="feed-container">
        <!-- Videos will be injected here -->
        
        <!-- Loading State -->
        <div class="loading-state" id="loading-spinner">
            <div class="glass-card">
                <div class="spinner-container">
                    <div class="radar-spinner"></div>
                </div>
                <h2 class="heading">Scanning the Skies...</h2>
                <p class="subtitle">Fetching your premium aviation feed</p>
            </div>
        </div>
    </div>

    <!-- Template for Empty State -->
    <template id="empty-state-template">
        <div class="empty-state">
            <div class="glass-card premium-empty">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="plane-icon"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.6L3 8l5.5 3.5-3.5 4-2.5-.5L1 17l4.5 2 2 4.5 2-1.5-.5-2.5 4-3.5 3.5 5.5c.3.5.7.7 1.2.6l1.2-.7c.4-.2.7-.6.6-1.1z"/></svg>
                </div>
                <h2 class="heading">Feed is Empty</h2>
                <p class="subtitle">Your production database doesn't have any curated videos yet. The background workflow will find one soon, or you can trigger it manually right now.</p>
                <button class="glow-btn" id="trigger-workflow-btn" onclick="triggerWorkflow()">
                    <span>Initialize Feed</span>
                    <div class="btn-glow"></div>
                </button>
            </div>
        </div>
    </template>

    <script>
        async function fetchVideos() {
            try {
                const response = await fetch('/api/videos');
                const videos = await response.json();
                
                const container = document.getElementById('feed-container');
                document.getElementById('loading-spinner').style.display = 'none';

                if (videos.length === 0) {
                    const template = document.getElementById('empty-state-template').content.cloneNode(true);
                    container.appendChild(template);
                    return;
                }

                // If videos exist, clear the container to remove empty state if it was there
                if (container.querySelector('.empty-state')) {
                    container.innerHTML = ''; 
                }

                videos.forEach((video, index) => {
                    const template = `
                        <div class="video-post">
                            <video 
                                src="/api/video/${video.videoId}" 
                                loop 
                                playsinline 
                                muted
                                class="main-video"
                            ></video>
                            <div class="overlay">
                                <div class="header">
                                    <div class="brand-pill">
                                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
                                        <span>Aviation Curator</span>
                                    </div>
                                    <button class="mute-btn" onclick="toggleMute(this)">
                                        <svg class="icon-muted" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                                        <svg class="icon-unmuted" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display:none;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                                    </button>
                                </div>
                                <div class="bottom-gradient"></div>
                                <div class="bottom-content">
                                    <h2 class="video-title">${video.title}</h2>
                                    <p class="caption">${formatCaption(video.humanized_caption)}</p>
                                </div>
                                <div class="action-buttons">
                                    <button class="action-btn">
                                        <div class="btn-icon">
                                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                        </div>
                                        <span>Like</span>
                                    </button>
                                    <button class="action-btn share-btn" onclick="shareVideo('${video.videoId}')">
                                        <div class="btn-icon">
                                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                                        </div>
                                        <span>Share</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', template);
                });

                setupIntersectionObserver();
                setupVideoTap();
            } catch (err) {
                console.error("Error fetching videos:", err);
            }
        }

        async function triggerWorkflow() {
            const btn = document.getElementById('trigger-workflow-btn');
            btn.classList.add('loading');
            btn.querySelector('span').innerText = 'Initializing... (takes ~10s)';
            btn.disabled = true;

            try {
                const res = await fetch('/api/trigger', { method: 'POST' });
                if (res.ok) {
                    // Poll for new videos since workflow is async
                    let attempts = 0;
                    const poll = setInterval(async () => {
                        attempts++;
                        const vRes = await fetch('/api/videos');
                        const vData = await vRes.json();
                        if (vData.length > 0) {
                            clearInterval(poll);
                            fetchVideos(); // Reload the whole feed
                        } else if (attempts > 15) {
                            clearInterval(poll);
                            btn.classList.remove('loading');
                            btn.querySelector('span').innerText = 'Taking longer than expected. Refresh soon.';
                        }
                    }, 2000);
                } else {
                    throw new Error("Failed to trigger");
                }
            } catch (err) {
                btn.classList.remove('loading');
                btn.querySelector('span').innerText = 'Error Triggering';
                console.error(err);
            }
        }

        function formatCaption(caption) {
            if (!caption) return '';
            return caption.replace(/(#\w+)/g, '<span class="hashtag">$1</span>');
        }

        function toggleMute(btn) {
            // Find the video in the current post
            const post = btn.closest('.video-post');
            const video = post.querySelector('.main-video');
            const iconMuted = btn.querySelector('.icon-muted');
            const iconUnmuted = btn.querySelector('.icon-unmuted');

            if (video.muted) {
                video.muted = false;
                iconMuted.style.display = 'none';
                iconUnmuted.style.display = 'block';
            } else {
                video.muted = true;
                iconMuted.style.display = 'block';
                iconUnmuted.style.display = 'none';
            }
            
            // Sync mute state across all videos for a better experience
            document.querySelectorAll('.main-video').forEach(v => {
                if (v !== video) v.muted = video.muted;
            });
            document.querySelectorAll('.mute-btn').forEach(b => {
                if (b !== btn) {
                    b.querySelector('.icon-muted').style.display = iconMuted.style.display;
                    b.querySelector('.icon-unmuted').style.display = iconUnmuted.style.display;
                }
            });
        }

        function setupIntersectionObserver() {
            const videos = document.querySelectorAll('.main-video');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        video.play().catch(e => console.log('Autoplay prevented:', e));
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, { threshold: 0.6 });

            videos.forEach(video => observer.observe(video));
        }

        function setupVideoTap() {
            document.querySelectorAll('.main-video').forEach(video => {
                video.addEventListener('click', () => {
                    if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }
                });
            });
        }

        function shareVideo(id) {
            if (navigator.share) {
                navigator.share({
                    title: 'Aviation Curator',
                    url: window.location.origin + '/?v=' + id
                });
            } else {
                navigator.clipboard.writeText(window.location.origin + '/?v=' + id);
                alert("Link copied to clipboard!");
            }
        }

        fetchVideos();
    </script>
</body>
</html>
